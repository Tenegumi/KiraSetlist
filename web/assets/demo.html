#kira-hosted-preview .manual-form input{display:block;width:100%;margin-top:4px;background:#251d2e;color:#fff;border:1px solid #685273;border-radius:5px;padding:9px;min-width:0}
#kira-hosted-preview .manual-form button{background:#5b3e71}
#kira-hosted-preview .book-item{display:flex;align-items:center;justify-content:space-between;padding:12px 0;border-bottom:1px solid #ffffff19;gap:10px}
#kira-hosted-preview .book-item strong{font-weight:500;display:block;font-size:13px}
#kira-hosted-preview .book-item small{color:#a99cb6;font-size:11px}
#kira-hosted-preview .book-item button{font-size:11px;white-space:nowrap;padding:6px 8px}
#kira-hosted-preview .book-note{font-size:11px;color:#b8a6c9;padding-top:15px}
#kira-hosted-preview .settings-heading{font-size:15px;margin:0 0 12px}
#kira-hosted-preview .setting{display:flex;justify-content:space-between;align-items:center;padding:12px 0;border-bottom:1px solid #ffffff16;gap:8px}
#kira-hosted-preview .setting input[type=checkbox]{accent-color:#b99adf;width:17px;height:17px}
#kira-hosted-preview .setting select{background:#2a2036;color:#efdeff;padding:6px;border:1px solid #685176;border-radius:5px;max-width:110px}
#kira-hosted-preview .range-setting{flex-wrap:wrap}
#kira-hosted-preview .range-setting input{width:100%;accent-color:#b99adf}
#kira-hosted-preview .statusbar{display:flex;gap:16px;flex-wrap:wrap;justify-content:space-between;padding:8px 12px;color:#b7b4c2;font-size:10px;background:#1c1e26}
#kira-hosted-preview .stage[data-edition=original] .amp{border:0;border-radius:2cqw;background:#1e142fd4;padding:1.7cqw;box-shadow:none}
#kira-hosted-preview .stage[data-edition=original] .amp-handle,#kira-hosted-preview .stage[data-edition=original] .amp-top,#kira-hosted-preview .stage[data-edition=original] .sleeve,#kira-hosted-preview .stage[data-edition=original] .signature{display:none}
#kira-hosted-preview .stage[data-edition=original] .singing-tag{transform:none;background:transparent;color:#d7b9ef;padding:0;box-shadow:none;font-size:1cqw;margin:.9cqw 0}
#kira-hosted-preview .stage[data-edition=original] .current-card{transform:none;color:#fff;background:transparent;box-shadow:none;padding:0;margin:1cqw 0 2cqw}
#kira-hosted-preview .stage[data-edition=original] .current-card .current-artist{color:#c4b5d0}
#kira-hosted-preview .stage[data-edition=original] .song-line{border:0;background:transparent;padding:.8cqw 0}
#kira-hosted-preview .stage[data-edition=original] .large-disc{left:0}
#kira-hosted-preview .stage[data-edition=original] .record{width:9cqw}
#kira-hosted-preview .stage.hit .lower-third{animation:kira-strum .48s both}
#kira-hosted-preview .stage.hit .current-card{animation:kira-card .4s both}
@keyframes kira-strum{0%{transform:translateX(-12px) rotate(-3deg);opacity:.3}45%{transform:translateX(5px) rotate(1.3deg)}72%{transform:translateX(-2px) rotate(-.6deg)}100%{transform:none;opacity:1}}
@keyframes kira-card{0%{translate:9px 0;opacity:.2}55%{translate:-3px 0;opacity:1}100%{translate:0 0}}
@media(max-width:740px){#kira-hosted-preview .workspace{grid-template-columns:minmax(0,1fr)}#kira-hosted-preview .dock-body{padding:18px}#kira-hosted-preview .queue{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:5px}#kira-hosted-preview .stage .amp{width:32%}#kira-hosted-preview .stage .amp h3,#kira-hosted-preview .stage .set-head{font-size:1.3cqw}#kira-hosted-preview .stage .song-line{font-size:1.6cqw}#kira-hosted-preview .current-card strong{font-size:2cqw}#kira-hosted-preview .lower-copy strong{font-size:4cqw}}
@media(max-width:420px){#kira-hosted-preview .queue{grid-template-columns:1fr}#kira-hosted-preview .menu-strip{font-size:10px;word-spacing:0}#kira-hosted-preview .window-head{padding:10px 16px;padding-right:100px;gap:5px}#kira-hosted-preview .obs-bottom{grid-template-columns:1fr 1fr}#kira-hosted-preview .obs-bottom section:last-child{grid-column:1/-1;min-height:70px}#kira-hosted-preview .preview-tools{font-size:10px}#kira-hosted-preview .stage{aspect-ratio:4/3}#kira-hosted-preview .amp{width:35%;right:3%;top:10%}#kira-hosted-preview .lower-third{bottom:5%}}
@media(pointer:coarse){#kira-hosted-preview button{min-height:44px}#kira-hosted-preview input:not([type=checkbox]),#kira-hosted-preview select{font-size:16px}#kira-hosted-preview .setting{min-height:48px}}
@media(prefers-reduced-motion:reduce){#kira-hosted-preview .stage.hit .lower-third,#kira-hosted-preview .stage.hit .current-card{animation:none}}

<script>(() => {
  const frame = document.getElementById("codex-visualization");
  if (!(frame instanceof HTMLIFrameElement)) {
    return;
  }
  let viewportHeight = globalThis.innerHeight;
  const storageKey = `codex:visualization-widget-state-v2:${JSON.stringify([
    globalThis.location.pathname,
    globalThis.location.search,
  ])}`;
  const parseState = (serializedState) => {
    if (
      typeof serializedState !== "string" ||
      new TextEncoder().encode(serializedState).length > 16 * 1024
    ) {
      throw new TypeError(
        "Widget state must be a JSON object of at most 16 KiB",
      );
    }
    /** @type {unknown} */
    const state = JSON.parse(serializedState);
    if (
      state == null ||
      typeof state !== "object" ||
      Array.isArray(state) ||
      ("imageIds" in state &&
        (!Array.isArray(state.imageIds) || state.imageIds.length > 0))
    ) {
      throw new TypeError("Widget state must be a JSON object");
    }
    const storedState = { modelContent: null, privateContent: null, ...state };
    const canonicalState = JSON.stringify(
      storedState,
      (_key, /** @type {unknown} */ value) => {
        if (typeof value === "number" && !Number.isFinite(value)) {
          throw new TypeError("Widget state must contain finite numbers");
        }
        return value;
      },
    );
    if (new TextEncoder().encode(canonicalState).length > 16 * 1024) {
      throw new TypeError(
        "Widget state must be a JSON object of at most 16 KiB",
      );
    }
    return storedState;

  let state = null;

    const probeKey = `${storageKey}:probe`;

    localStorage.removeItem(probeKey);
    storage = localStorage;
    const savedState = storage.getItem(storageKey);

      try {
        state = parseState(savedState);
      } catch {
        // Invalid saved state does not disable future writes.
      }

  } catch {
    storage = null;
  }
  const initialGlobals = {
    widgetState: state,
    statePersistence: storage == null ? "none" : "local",
  };

  const channel = new MessageChannel();
  channel.port1.addEventListener("message", (event) => {
    const data = event.data;
    if (typeof data !== "object" || data == null) {
      return;
    }
    if (data.type === "widget-state-write") {
      if (!Number.isSafeInteger(data.id) || data.id <= 0) {
        return;
      }
      let ok = false;
      try {
        if (storage != null) {
          const state = parseState(data.state);
          storage.setItem(storageKey, JSON.stringify(state));
          ok = true;
        }
      } catch {
        // Storage denial, quota limits, and invalid state return a failed receipt.
      }
      channel.port1.postMessage({
        type: "widget-state-result",
        id: data.id,
        ok,
      });

    }
    if (data.type === "height") {
      const height = data.height;

        typeof height === "number" &&
        Number.isFinite(height) &&
        height >= 0 &&
        height <= 10_000
      ) {

    }

        typeof top === "number" &&
        Number.isFinite(top) &&

      return;
    }

      const rawHref = data.href;
      if (typeof rawHref !== "string") {

      }
      let href;
      try {
        const url = new URL(rawHref, document.baseURI);
        if (url.protocol !== "https:") {
          return;
        }
        href = url.href;

        return;
      }
      if (globalThis.navigator.userActivation?.isActive === true) {
        const anchor = document.createElement("a");
        anchor.href = href;
        anchor.rel = "noopener noreferrer";

        anchor.click();
        anchor.remove();

      return;

      const prompt = data.prompt;

        typeof prompt !== "string" ||

    "load",
    () => {

  frame.srcdoc = srcdoc.replace(
    '<script type="application/json" id="codex-visualization-widget-state">__CODEX_VISUALIZATION_WIDGET_STATE__<\/script>',
    () =>
      '<script type="application/json" id="codex-visualization-widget-state">' +
      JSON.stringify(initialGlobals).replaceAll("<", "\\u003c") +
      "<\/script>",
  );
  delete frame.dataset.srcdoc;
})();
