name: Tests
on: [push, pull_request]
permissions:
  contents: read
jobs:
  tests:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
      - name: Prepare runtime for isolated installer test
        run: |
          New-Item -ItemType Directory -Force app/runtime | Out-Null
          Copy-Item -LiteralPath (Get-Command node).Source -Destination app/runtime/node.exe
      - run: npm test
